<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b1a2a" flood-opacity="0.14"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1400" height="760" fill="#f7f9fc"/>
  <text x="60" y="56" font-size="28" font-weight="700" fill="#0f2740">System Architecture</text>
  <text x="60" y="82" font-size="14" fill="#52667a">Two symmetric ESP32 peers, a PC ground station, and one bidirectional 433 MHz LoRa link.</text>

  <!-- Browser -->
  <rect x="60" y="130" width="230" height="110" rx="12" fill="url(#lg)" stroke="#c7d5e5" filter="url(#sh)"/>
  <text x="175" y="164" font-size="14" font-weight="700" fill="#0f2740" text-anchor="middle">Operator</text>
  <text x="175" y="186" font-size="12" fill="#52667a" text-anchor="middle">Browser</text>
  <text x="175" y="206" font-size="12" fill="#52667a" text-anchor="middle">http://localhost:8501</text>
  <text x="175" y="226" font-size="11.5" fill="#7b8ea3" text-anchor="middle">enters text / 4 values</text>

  <!-- Dashboard -->
  <rect x="380" y="120" width="300" height="300" rx="12" fill="url(#lg)" stroke="#c7d5e5" filter="url(#sh)"/>
  <text x="530" y="152" font-size="14" font-weight="700" fill="#0f2740" text-anchor="middle">Streamlit ground station</text>
  <text x="530" y="171" font-size="11.5" fill="#7b8ea3" text-anchor="middle">dashboard/peer_app.py</text>

  <rect x="404" y="188" width="252" height="42" rx="7" fill="#e8f1fb" stroke="#c7d5e5"/>
  <text x="530" y="214" font-size="12" fill="#1e3a5f" text-anchor="middle">peer_app.py — UI + state loop</text>

  <rect x="404" y="240" width="252" height="42" rx="7" fill="#e8f1fb" stroke="#c7d5e5"/>
  <text x="530" y="266" font-size="12" fill="#1e3a5f" text-anchor="middle">telemetry_parser.py — protocol</text>

  <rect x="404" y="292" width="252" height="42" rx="7" fill="#e8f1fb" stroke="#c7d5e5"/>
  <text x="530" y="318" font-size="12" fill="#1e3a5f" text-anchor="middle">serial_manager.py — 2 workers</text>

  <rect x="404" y="344" width="252" height="42" rx="7" fill="#e8f1fb" stroke="#c7d5e5"/>
  <text x="530" y="370" font-size="12" fill="#1e3a5f" text-anchor="middle">diagnostics.py — health checks</text>

  <!-- Serial -->
  <path d="M290 185 L380 200" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M380 240 L290 215" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- ESP32 #1 -->
  <rect x="780" y="120" width="230" height="150" rx="12" fill="url(#lg)" stroke="#c7d5e5" filter="url(#sh)"/>
  <text x="895" y="152" font-size="14" font-weight="700" fill="#0f2740" text-anchor="middle">ESP32 #1</text>
  <text x="895" y="174" font-size="11.5" fill="#7b8ea3" text-anchor="middle">peer.ino · COM4 · ID 7630</text>
  <rect x="804" y="190" width="182" height="30" rx="6" fill="#e8f1fb" stroke="#c7d5e5"/>
  <text x="895" y="210" font-size="11.5" fill="#1e3a5f" text-anchor="middle">SX1278 · 433 MHz · SF7</text>
  <rect x="804" y="228" width="182" height="30" rx="6" fill="#e8f1fb" stroke="#c7d5e5"/>
  <text x="895" y="248" font-size="11.5" fill="#1e3a5f" text-anchor="middle">TX + RX (symmetric peer)</text>

  <!-- ESP32 #2 -->
  <rect x="1110" y="120" width="230" height="150" rx="12" fill="url(#lg)" stroke="#c7d5e5" filter="url(#sh)"/>
  <text x="1225" y="152" font-size="14" font-weight="700" fill="#0f2740" text-anchor="middle">ESP32 #2</text>
  <text x="1225" y="174" font-size="11.5" fill="#7b8ea3" text-anchor="middle">peer.ino · COM6 · ID 2DF4</text>
  <rect x="1134" y="190" width="182" height="30" rx="6" fill="#e8f1fb" stroke="#c7d5e5"/>
  <text x="1225" y="210" font-size="11.5" fill="#1e3a5f" text-anchor="middle">SX1278 · 433 MHz · SF7</text>
  <rect x="1134" y="228" width="182" height="30" rx="6" fill="#e8f1fb" stroke="#c7d5e5"/>
  <text x="1225" y="248" font-size="11.5" fill="#1e3a5f" text-anchor="middle">TX + RX (symmetric peer)</text>

  <!-- USB links -->
  <path d="M680 300 L780 240" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M780 270 L680 330" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="722" y="296" font-size="10.5" fill="#3b5a7a" text-anchor="middle">USB serial</text>
  <text x="722" y="310" font-size="10.5" fill="#3b5a7a" text-anchor="middle">115200</text>

  <!-- dashboard to peer2 via bus -->
  <path d="M680 360 L720 360 L720 400 L1225 400 L1225 270" stroke="#7c8fa4" stroke-width="1.6" fill="none" stroke-dasharray="5 5" marker-end="url(#ar)"/>
  <text x="960" y="392" font-size="10.5" fill="#5c7085" text-anchor="middle">second serial worker → COM6</text>

  <!-- RF link -->
  <path d="M1010 195 L1110 195" stroke="#0f766e" stroke-width="2.5" fill="none" stroke-dasharray="8 6"/>
  <path d="M1110 210 L1010 210" stroke="#0f766e" stroke-width="2.5" fill="none" stroke-dasharray="8 6" marker-end="url(#ar2)"/>
  <text x="1060" y="184" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">433 MHz RF</text>

  <!-- Protocol panel -->
  <rect x="60" y="470" width="620" height="240" rx="12" fill="#ffffff" stroke="#dbe4ee"/>
  <text x="84" y="500" font-size="14" font-weight="700" fill="#0f2740">Packet format on air</text>
  <text x="84" y="528" font-size="12" fill="#52667a">Data (T = text, D = numeric):</text>
  <text x="84" y="552" font-size="13" font-family="Consolas, monospace" fill="#0f2740">P,&lt;seq&gt;,&lt;senderId&gt;,&lt;T|D&gt;,&lt;payload&gt;,&lt;crc16&gt;</text>
  <text x="84" y="580" font-size="12" fill="#52667a">Acknowledgement:</text>
  <text x="84" y="604" font-size="13" font-family="Consolas, monospace" fill="#0f2740">A,&lt;seq&gt;,&lt;ackerId&gt;</text>
  <text x="84" y="634" font-size="12" fill="#52667a">Payload: text = ASCII hex · numeric = c1;c2;c3;c4 (0–4095)</text>
  <text x="84" y="658" font-size="12" fill="#52667a">CRC: CRC-16/CCITT over P,&lt;seq&gt;,&lt;senderId&gt;,&lt;type&gt;,&lt;payload&gt;</text>
  <text x="84" y="682" font-size="12" fill="#52667a">Retries: up to 3, same sequence number · duplicate window: 16 entries</text>

  <!-- Flow panel -->
  <rect x="720" y="470" width="620" height="240" rx="12" fill="#ffffff" stroke="#dbe4ee"/>
  <text x="744" y="500" font-size="14" font-weight="700" fill="#0f2740">Transmission sequence</text>
  <g font-size="12.5" fill="#334155">
    <text x="744" y="526">1 · Operator clicks TRANSMIT in the dashboard</text>
    <text x="744" y="550">2 · Command line goes over USB to the sending peer</text>
    <text x="744" y="574">3 · Peer builds packet, CRC-16, increments sequence</text>
    <text x="744" y="598">4 · Packet is transmitted on 433 MHz</text>
    <text x="744" y="622">5 · Receiver validates CRC, de-duplicates, shows values</text>
    <text x="744" y="646">6 · Receiver waits 200 ms, sends A,&lt;seq&gt;,&lt;id&gt; twice</text>
    <text x="744" y="670">7 · Sender matches the ACK → DELIVERY CONFIRMED</text>
    <text x="744" y="694">8 · No ACK → retry, then DELIVERY NOT CONFIRMED</text>
  </g>
</svg>
