<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16324f"/>
      <stop offset="100%" stop-color="#0b1a2a"/>
    </linearGradient>
    <linearGradient id="mod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4d3f"/>
      <stop offset="100%" stop-color="#0e2a22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b1a2a" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1400" height="1010" fill="#f7f9fc"/>

  <!-- Title -->
  <text x="60" y="58" font-size="30" font-weight="700" fill="#0f2740">ESP32 + RA-02 LoRa — Dual Peer Wiring</text>
  <text x="60" y="86" font-size="15" fill="#52667a">Identical wiring for both boards. Each ESP32 runs the same <tspan font-family="Consolas, monospace" fill="#0f2740">peer.ino</tspan> firmware and can transmit and receive.</text>

  <!-- ================= UNIT A ================= -->
  <g>
    <text x="60" y="150" font-size="16" font-weight="700" fill="#0f2740">ESP32 #1  ·  COM4  ·  device ID 7630</text>

    <!-- ESP32 board -->
    <rect x="60" y="170" width="200" height="520" rx="14" fill="url(#board)" filter="url(#shadow)"/>
    <rect x="72" y="182" width="176" height="496" rx="9" fill="none" stroke="#2a4d70" stroke-width="1"/>
    <text x="160" y="210" font-size="13" font-weight="700" fill="#8fb8dd" text-anchor="middle">ESP32 DEVKIT</text>
    <text x="160" y="229" font-size="10.5" fill="#5f86aa" text-anchor="middle">ESP32-WROOM-32</text>

    <!-- module -->
    <rect x="470" y="200" width="180" height="460" rx="12" fill="url(#mod)" filter="url(#shadow)"/>
    <rect x="482" y="212" width="156" height="436" rx="8" fill="none" stroke="#2f6f5c" stroke-width="1"/>
    <text x="560" y="240" font-size="13" font-weight="700" fill="#93dcc6" text-anchor="middle">RA-02 / SX1278</text>
    <text x="560" y="258" font-size="10.5" fill="#6aa593" text-anchor="middle">433 MHz module</text>

    <!-- antenna -->
    <line x1="560" y1="200" x2="560" y2="150" stroke="#475569" stroke-width="2.5"/>
    <path d="M560 150 l-10 -14 l20 -12 l-20 -12 l20 -12" fill="none" stroke="#475569" stroke-width="2.5"/>
    <text x="580" y="128" font-size="10.5" fill="#52667a">433 MHz antenna</text>
    <text x="580" y="142" font-size="10.5" fill="#b91c1c">always fitted</text>

    <!-- rows -->
    <!-- 3V3 -->
    <circle cx="260" cy="292" r="4.5" fill="#d92b2b"/>
    <circle cx="470" cy="292" r="4.5" fill="#d92b2b"/>
    <line x1="260" y1="292" x2="470" y2="292" stroke="#d92b2b" stroke-width="3"/>
    <text x="365" y="284" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">3.3 V</text>
    <text x="252" y="296" font-size="11" font-weight="600" fill="#e8f2fb" text-anchor="end">3V3</text>
    <text x="478" y="296" font-size="11" font-weight="600" fill="#e8f2fb">3.3V</text>

    <!-- GND -->
    <circle cx="260" cy="348" r="4.5" fill="#334155"/>
    <circle cx="470" cy="348" r="4.5" fill="#334155"/>
    <line x1="260" y1="348" x2="470" y2="348" stroke="#334155" stroke-width="3"/>
    <text x="365" y="340" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">GND</text>
    <text x="252" y="352" font-size="11" font-weight="600" fill="#e8f2fb" text-anchor="end">GND</text>
    <text x="478" y="352" font-size="11" font-weight="600" fill="#e8f2fb">GND</text>

    <!-- SCK -->
    <circle cx="260" cy="404" r="4.5" fill="#1f6feb"/>
    <circle cx="470" cy="404" r="4.5" fill="#1f6feb"/>
    <line x1="260" y1="404" x2="470" y2="404" stroke="#1f6feb" stroke-width="3"/>
    <text x="365" y="396" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">SCK</text>
    <text x="252" y="408" font-size="11" font-weight="600" fill="#e8f2fb" text-anchor="end">GPIO 18</text>
    <text x="478" y="408" font-size="11" font-weight="600" fill="#e8f2fb">SCK</text>

    <!-- MISO -->
    <circle cx="260" cy="460" r="4.5" fill="#1a7f37"/>
    <circle cx="470" cy="460" r="4.5" fill="#1a7f37"/>
    <line x1="260" y1="460" x2="470" y2="460" stroke="#1a7f37" stroke-width="3"/>
    <text x="365" y="452" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="middle">MISO</text>
    <text x="252" y="464" font-size="11" font-weight="600" fill="#e8f2fb" text-anchor="end">GPIO 19</text>
    <text x="478" y="464" font-size="11" font-weight="600" fill="#e8f2fb">MISO</text>

    <!-- MOSI -->
    <circle cx="260" cy="516" r="4.5" fill="#e36209"/>
    <circle cx="470" cy="516" r="4.5" fill="#e36209"/>
    <line x1="260" y1="516" x2="470" y2="516" stroke="#e36209" stroke-width="3"/>
    <text x="365" y="508" font-size="10.5" font-weight="700" fill="#c2410c" text-anchor="middle">MOSI</text>
    <text x="252" y="520" font-size="11" font-weight="600" fill="#e8f2fb" text-anchor="end">GPIO 23</text>
    <text x="478" y="520" font-size="11" font-weight="600" fill="#e8f2fb">MOSI</text>

    <!-- NSS -->
    <circle cx="260" cy="572" r="4.5" fill="#8250df"/>
    <circle cx="470" cy="572" r="4.5" fill="#8250df"/>
    <line x1="260" y1="572" x2="470" y2="572" stroke="#8250df" stroke-width="3"/>
    <text x="365" y="564" font-size="10.5" font-weight="700" fill="#6d28d9" text-anchor="middle">NSS / CS</text>
    <text x="252" y="576" font-size="11" font-weight="600" fill="#e8f2fb" text-anchor="end">GPIO 5</text>
    <text x="478" y="576" font-size="11" font-weight="600" fill="#e8f2fb">NSS</text>

    <!-- RST -->
    <circle cx="260" cy="628" r="4.5" fill="#9a6700"/>
    <circle cx="470" cy="628" r="4.5" fill="#9a6700"/>
    <line x1="260" y1="628" x2="470" y2="628" stroke="#9a6700" stroke-width="3"/>
    <text x="365" y="620" font-size="10.5" font-weight="700" fill="#854d0e" text-anchor="middle">RESET</text>
    <text x="252" y="632" font-size="11" font-weight="600" fill="#e8f2fb" text-anchor="end">GPIO 14</text>
    <text x="478" y="632" font-size="11" font-weight="600" fill="#e8f2fb">RST</text>

    <!-- DIO0 -->
    <circle cx="260" cy="684" r="4.5" fill="#0d9488"/>
    <circle cx="470" cy="684" r="4.5" fill="#0d9488"/>
    <line x1="260" y1="684" x2="470" y2="684" stroke="#0d9488" stroke-width="3"/>
    <text x="365" y="676" font-size="10.5" font-weight="700" fill="#0f766e" text-anchor="middle">DIO0</text>
    <text x="252" y="688" font-size="11" font-weight="600" fill="#e8f2fb" text-anchor="end">GPIO 26</text>
    <text x="478" y="688" font-size="11" font-weight="600" fill="#e8f2fb">DIO0</text>

    <!-- USB -->
    <rect x="132" y="690" width="56" height="16" rx="3" fill="#94a3b8"/>
    <text x="160" y="716" font-size="10.5" fill="#52667a" text-anchor="middle">USB → PC</text>
  </g>

  <!-- ================= UNIT B ================= -->
  <g transform="translate(660,0)">
    <text x="60" y="150" font-size="16" font-weight="700" fill="#0f2740">ESP32 #2  ·  COM6  ·  device ID 2DF4</text>

    <rect x="60" y="170" width="200" height="520" rx="14" fill="url(#board)" filter="url(#shadow)"/>
    <rect x="72" y="182" width="176" height="496" rx="9" fill="none" stroke="#2a4d70" stroke-width="1"/>
    <text x="160" y="210" font-size="13" font-weight="700" fill="#8fb8dd" text-anchor="middle">ESP32 DEVKIT</text>
    <text x="160" y="229" font-size="10.5" fill="#5f86aa" text-anchor="middle">ESP32-WROOM-32</text>

    <rect x="470" y="200" width="180" height="460" rx="12" fill="url(#mod)" filter="url(#shadow)"/>
    <rect x="482" y="212" width="156" height="436" rx="8" fill="none" stroke="#2f6f5c" stroke-width="1"/>
    <text x="560" y="240" font-size="13" font-weight="700" fill="#93dcc6" text-anchor="middle">RA-02 / SX1278</text>
    <text x="560" y="258" font-size="10.5" fill="#6aa593" text-anchor="middle">433 MHz module</text>

    <line x1="560" y1="200" x2="560" y2="150" stroke="#475569" stroke-width="2.5"/>
    <path d="M560 150 l-10 -14 l20 -12 l-20 -12 l20 -12" fill="none" stroke="#475569" stroke-width="2.5"/>
    <text x="580" y="128" font-size="10.5" fill="#52667a">433 MHz antenna</text>
    <text x="580" y="142" font-size="10.5" fill="#b91c1c">always fitted</text>

    <circle cx="260" cy="292" r="4.5" fill="#d92b2b"/><circle cx="470" cy="292" r="4.5" fill="#d92b2b"/>
    <line x1="260" y1="292" x2="470" y2="292" stroke="#d92b2b" stroke-width="3"/>
    <text x="365" y="284" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">3.3 V</text>
    <text x="252" y="296" font-size="11" font-weight="600" fill="#e8f2fb" text-anchor="end">3V3</text>
    <text x="478" y="296" font-size="11" font-weight="600" fill="#e8f2fb">3.3V</text>

    <circle cx="260" cy="348" r="4.5" fill="#334155"/><circle cx="470" cy="348" r="4.5" fill="#334155"/>
    <line x1="260" y1="348" x2="470" y2="348" stroke="#334155" stroke-width="3"/>
    <text x="365" y="340" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">GND</text>
    <text x="252" y="352" font-size="11" font-weight="600" fill="#e8f2fb" text-anchor="end">GND</text>
    <text x="478" y="352" font-size="11" font-weight="600" fill="#e8f2fb">GND</text>

    <circle cx="260" cy="404" r="4.5" fill="#1f6feb"/><circle cx="470" cy="404" r="4.5" fill="#1f6feb"/>
    <line x1="260" y1="404" x2="470" y2="404" stroke="#1f6feb" stroke-width="3"/>
    <text x="365" y="396" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">SCK</text>
    <text x="252" y="408" font-size="11" font-weight="600" fill="#e8f2fb" text-anchor="end">GPIO 18</text>
    <text x="478" y="408" font-size="11" font-weight="600" fill="#e8f2fb">SCK</text>

    <circle cx="260" cy="460" r="4.5" fill="#1a7f37"/><circle cx="470" cy="460" r="4.5" fill="#1a7f37"/>
    <line x1="260" y1="460" x2="470" y2="460" stroke="#1a7f37" stroke-width="3"/>
    <text x="365" y="452" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="middle">MISO</text>
    <text x="252" y="464" font-size="11" font-weight="600" fill="#e8f2fb" text-anchor="end">GPIO 19</text>
    <text x="478" y="464" font-size="11" font-weight="600" fill="#e8f2fb">MISO</text>

    <circle cx="260" cy="516" r="4.5" fill="#e36209"/><circle cx="470" cy="516" r="4.5" fill="#e36209"/>
    <line x1="260" y1="516" x2="470" y2="516" stroke="#e36209" stroke-width="3"/>
    <text x="365" y="508" font-size="10.5" font-weight="700" fill="#c2410c" text-anchor="middle">MOSI</text>
    <text x="252" y="520" font-size="11" font-weight="600" fill="#e8f2fb" text-anchor="end">GPIO 23</text>
    <text x="478" y="520" font-size="11" font-weight="600" fill="#e8f2fb">MOSI</text>

    <circle cx="260" cy="572" r="4.5" fill="#8250df"/><circle cx="470" cy="572" r="4.5" fill="#8250df"/>
    <line x1="260" y1="572" x2="470" y2="572" stroke="#8250df" stroke-width="3"/>
    <text x="365" y="564" font-size="10.5" font-weight="700" fill="#6d28d9" text-anchor="middle">NSS / CS</text>
    <text x="252" y="576" font-size="11" font-weight="600" fill="#e8f2fb" text-anchor="end">GPIO 5</text>
    <text x="478" y="576" font-size="11" font-weight="600" fill="#e8f2fb">NSS</text>

    <circle cx="260" cy="628" r="4.5" fill="#9a6700"/><circle cx="470" cy="628" r="4.5" fill="#9a6700"/>
    <line x1="260" y1="628" x2="470" y2="628" stroke="#9a6700" stroke-width="3"/>
    <text x="365" y="620" font-size="10.5" font-weight="700" fill="#854d0e" text-anchor="middle">RESET</text>
    <text x="252" y="632" font-size="11" font-weight="600" fill="#e8f2fb" text-anchor="end">GPIO 14</text>
    <text x="478" y="632" font-size="11" font-weight="600" fill="#e8f2fb">RST</text>

    <circle cx="260" cy="684" r="4.5" fill="#0d9488"/><circle cx="470" cy="684" r="4.5" fill="#0d9488"/>
    <line x1="260" y1="684" x2="470" y2="684" stroke="#0d9488" stroke-width="3"/>
    <text x="365" y="676" font-size="10.5" font-weight="700" fill="#0f766e" text-anchor="middle">DIO0</text>
    <text x="252" y="688" font-size="11" font-weight="600" fill="#e8f2fb" text-anchor="end">GPIO 26</text>
    <text x="478" y="688" font-size="11" font-weight="600" fill="#e8f2fb">DIO0</text>

    <rect x="132" y="690" width="56" height="16" rx="3" fill="#94a3b8"/>
    <text x="160" y="716" font-size="10.5" fill="#52667a" text-anchor="middle">USB → PC</text>
  </g>

  <!-- RF link -->
  <path d="M650 380 Q700 330 720 380" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="648" y="318" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">433 MHz LoRa</text>
  <text x="648" y="334" font-size="10.5" fill="#0c7295" text-anchor="middle">SX1278 ↔ SX1278</text>

  <!-- Bottom panel -->
  <rect x="60" y="760" width="640" height="215" rx="12" fill="#ffffff" stroke="#dbe4ee"/>
  <text x="84" y="790" font-size="14" font-weight="700" fill="#0f2740">Connection table (same on both boards)</text>
  <g font-size="12" fill="#334155">
    <text x="84" y="818" font-family="Consolas, monospace">RA-02 3.3V   → ESP32 3V3</text>
    <text x="84" y="840" font-family="Consolas, monospace">RA-02 GND    → ESP32 GND</text>
    <text x="84" y="862" font-family="Consolas, monospace">RA-02 SCK    → ESP32 GPIO 18</text>
    <text x="84" y="884" font-family="Consolas, monospace">RA-02 MISO   → ESP32 GPIO 19</text>
    <text x="84" y="906" font-family="Consolas, monospace">RA-02 MOSI   → ESP32 GPIO 23</text>
    <text x="84" y="928" font-family="Consolas, monospace">RA-02 NSS/CS → ESP32 GPIO 5</text>
    <text x="84" y="950" font-family="Consolas, monospace">RA-02 RESET  → ESP32 GPIO 14</text>
    <text x="420" y="818" font-family="Consolas, monospace">RA-02 DIO0   → ESP32 GPIO 26</text>
    <text x="420" y="840" font-family="Consolas, monospace">RA-02 ANT    → 433 MHz antenna</text>
  </g>

  <rect x="720" y="760" width="620" height="215" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="744" y="790" font-size="14" font-weight="700" fill="#9a3412">Safety and power</text>
  <g font-size="12.5" fill="#7c2d12">
    <text x="744" y="816">• RA-02 is a 3.3 V module — never connect it to 5 V or VIN.</text>
    <text x="744" y="838">• Both boards are powered from USB; keep the 3.3 V rail separate.</text>
    <text x="744" y="860">• Fit the 433 MHz antenna before the first transmission.</text>
    <text x="744" y="882">• Do not transmit without an antenna: the PA can be damaged.</text>
    <text x="744" y="904">• Keep the two antennas at least a few centimetres apart.</text>
    <text x="744" y="926">• Common ground between ESP32 and RA-02 is mandatory.</text>
    <text x="744" y="948">• Logic levels are 3.3 V — no level shifter is required.</text>
  </g>
</svg>
